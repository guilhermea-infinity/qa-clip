apply plugin: 'com.android.application'

android {
    namespace 'com.infinitygames.qaclip'
    compileSdk 36
    defaultConfig {
        applicationId 'com.infinitygames.qaclip'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '0.7.0'
        testInstrumentationRunner 'com.infinitygames.qaclip.BatchInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
